services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pta-postgres
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      # Host 5433 — 5432 often taken by other local Postgres containers
      - "5433:5432"
    volumes:
      - pta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pta-redis
    ports:
      # Host 6380 — 6379 often taken by other local Redis containers
      - "6380:6379"
    volumes:
      - pta_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible local store. minio/minio is often denied for anonymous Docker Hub pulls.
  object-storage:
    image: adobe/s3mock:latest
    container_name: pta-object-storage
    environment:
      initialBuckets: private-trading
      retainFilesOnExit: "false"
    ports:
      - "9000:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pta_pg_data:
  pta_redis_data:
