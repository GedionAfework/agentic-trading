[project]
name = "private-trading-journal"
version = "0.1.0"
description = "Trade journal and analytics"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "private-trading-db",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_journal"]

[tool.uv.sources]
private-trading-core = { workspace = true }
private-trading-db = { workspace = true }
