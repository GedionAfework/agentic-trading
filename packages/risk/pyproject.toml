[project]
name = "private-trading-risk"
version = "0.1.0"
description = "Risk and portfolio limits"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "private-trading-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_risk"]

[tool.uv.sources]
private-trading-core = { workspace = true }
private-trading-db = { workspace = true }
