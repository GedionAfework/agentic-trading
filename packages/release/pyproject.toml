[project]
name = "private-trading-release"
version = "0.1.0"
description = "Live alert release gates — alerts only, no broker execution"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "private-trading-db",
    "private-trading-paper-trade",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_release"]

[tool.uv.sources]
private-trading-core = { workspace = true }
private-trading-db = { workspace = true }
private-trading-paper-trade = { workspace = true }
