[project]
name = "private-trading-ai-gateway"
version = "0.1.0"
description = "Ollama/vLLM abstraction"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_ai_gateway"]

[tool.uv.sources]
private-trading-core = { workspace = true }
