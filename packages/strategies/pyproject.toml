[project]
name = "private-trading-strategies"
version = "0.1.0"
description = "Versioned strategy engine"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "private-trading-db",
    "private-trading-features",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_strategies"]

[tool.uv.sources]
private-trading-core = { workspace = true }
private-trading-db = { workspace = true }
private-trading-features = { workspace = true }
