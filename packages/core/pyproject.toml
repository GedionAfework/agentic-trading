[project]
name = "private-trading-core"
version = "0.1.0"
description = "Shared config, logging, IDs, time, and errors"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_core"]
