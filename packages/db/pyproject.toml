[project]
name = "private-trading-db"
version = "0.1.0"
description = "SQLAlchemy models and repositories"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "email-validator>=2.2",
    "pgvector>=0.3",
]

[project.scripts]
pta-seed-owner = "private_trading_db.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_db"]

[tool.uv.sources]
private-trading-core = { workspace = true }
