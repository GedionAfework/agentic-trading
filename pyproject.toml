[project]
name = "agentic-trading"
version = "0.1.0"
description = "Private self-hosted AI trading copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "private-trading-api",
    "private-trading-db",
    "private-trading-ai-gateway",
    "private-trading-knowledge",
    "private-trading-market-data",
    "private-trading-features",
    "private-trading-strategies",
    "private-trading-risk",
    "private-trading-backtest",
    "private-trading-decision",
    "private-trading-agents",
    "private-trading-analytics",
    "private-trading-worker",
    "private-trading-telegram",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "apps/telegram",
    "packages/core",
    "packages/db",
    "packages/market_data",
    "packages/features",
    "packages/strategies",
    "packages/risk",
    "packages/knowledge",
    "packages/ai_gateway",
    "packages/agents",
    "packages/decision",
    "packages/backtest",
    "packages/paper_trade",
    "packages/journal",
    "packages/notifications",
    "packages/analytics",
]

[tool.uv.sources]
private-trading-api = { workspace = true }
private-trading-worker = { workspace = true }
private-trading-telegram = { workspace = true }
private-trading-core = { workspace = true }
private-trading-db = { workspace = true }
private-trading-market-data = { workspace = true }
private-trading-features = { workspace = true }
private-trading-strategies = { workspace = true }
private-trading-risk = { workspace = true }
private-trading-knowledge = { workspace = true }
private-trading-ai-gateway = { workspace = true }
private-trading-agents = { workspace = true }
private-trading-decision = { workspace = true }
private-trading-backtest = { workspace = true }
private-trading-paper-trade = { workspace = true }
private-trading-journal = { workspace = true }
private-trading-notifications = { workspace = true }
private-trading-analytics = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["private_trading_core", "private_trading_api"]
mypy_path = [
    "packages/core/src",
    "apps/api/src",
]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
