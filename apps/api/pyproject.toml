[project]
name = "private-trading-api"
version = "0.1.0"
description = "FastAPI application entrypoint"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
private-trading-api = "private_trading_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_api"]

[tool.uv.sources]
private-trading-core = { workspace = true }
