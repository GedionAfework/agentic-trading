[project]
name = "private-trading-telegram"
version = "0.1.0"
description = "Telegram bot entrypoint (long-polling fallback; webhook lives in the API)"
requires-python = ">=3.12"
dependencies = [
    "private-trading-core",
    "private-trading-db",
    "private-trading-notifications",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_trading_telegram"]

[tool.uv.sources]
private-trading-core = { workspace = true }
private-trading-db = { workspace = true }
private-trading-notifications = { workspace = true }
